<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IGL Safety Intelligence</title>
  <link rel="stylesheet" href="css/styles.css?v=platform-audit-3">
  <script src="js/app.js?v=platform-audit-3" defer></script>
</head>
<body>
  <!-- No login screen: this deployment has no authentication, so there is
       nothing to sign in to. Restrict access at the network layer instead. -->
  <div id="app-shell" class="app-shell" hidden>
    <aside class="sidebar">
      <a class="brand" href="#overview" aria-label="IGL Safety Intelligence home">
        <span class="brand-mark" aria-hidden="true">IGL<span>/</span>SI</span>
        <span class="brand-copy">Safety<br>Intelligence</span>
      </a>
      <p class="nav-label">MONITOR</p>
      <nav id="navigation" aria-label="Primary navigation">
        <button class="nav-item active" data-view="overview"><span class="nav-symbol">[]</span>Overview</button>
        <button class="nav-item" data-view="cameras"><span class="nav-symbol">O</span>Cameras</button>
        <button class="nav-item" data-view="events"><span class="nav-symbol">~</span>Events</button>
        <button class="nav-item" data-view="evidence"><span class="nav-symbol">#</span>Evidence</button>
        <button class="nav-item" data-view="configuration"><span class="nav-symbol">C</span>Configuration</button>
        <button class="nav-item" data-view="analytics"><span class="nav-symbol">%</span>Analytics</button>
        <button class="nav-item" data-view="system"><span class="nav-symbol">+</span>System health</button>
        <button class="nav-item" data-view="audit"><span class="nav-symbol">=</span>Audit log</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="igltarget"><span class="status-dot dot-amber"></span><span>IGL VALIDATION<br><strong>NOT VALIDATED</strong></span></div>
        <div class="nav-item static-note"><span class="nav-symbol">!</span>NO AUTHENTICATION<br><strong>RESTRICT AT NETWORK</strong></div>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="view-kicker">OPERATIONS / CURRENT STATE</p>
          <h1 id="view-title">Overview</h1>
        </div>
        <div class="topbar-right">
          <label class="api-field" for="api-base">API base
            <input id="api-base" type="url" value="http://localhost:8000/api/v1" autocomplete="url">
          </label>
          <span class="api-state"><span class="status-dot dot-muted" id="api-dot"></span><span id="api-state-text">Checking API</span></span>
          <button class="icon-button" id="refresh-button" title="Refresh data" aria-label="Refresh data">R</button>
        </div>
      </header>
      <div id="global-message" class="global-message" role="status" hidden></div>
      <div id="alarm-region" class="alarm-region" role="status" aria-live="assertive" aria-atomic="true"></div>
      <section id="view-content" class="view-content" aria-live="polite"></section>
      <footer class="page-footer">
        <span>Decision support only · no plant controls</span>
        <span id="last-updated">Data not loaded</span>
      </footer>
    </main>
  </div>
</body>
</html>
